services:
  api:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BASE_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      SHORT_CODE_LENGTH: 7
      DEFAULT_TTL_SECONDS: 0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
